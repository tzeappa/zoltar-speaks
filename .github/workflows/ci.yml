name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Makefile parses
        run: make help
      - name: Shell scripts (Mac starter)
        run: shellcheck scripts/*.sh install.sh *.command
      - name: Typecheck
        run: npm run typecheck
      - name: Unit, integration, and security tests
        run: npm test
      - name: Smoke test against the running server
        run: npm run smoke
      - name: Labeled eval with the mock model (fails on any missed escalation)
        run: npm run eval -- --mock
      - name: Playbook retrieval eval, keyword and hybrid (offline embedder)
        run: npm run eval:retrieval -- --mock

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Known vulnerabilities (high and critical)
        run: npm audit --audit-level=high
      - name: Registry signatures
        run: npm audit signatures

  # Merges Dependabot PRs, majors included, only after every check above passed. Lives here, not in a separate
  # workflow, so it cannot run ahead of the tests even without branch protection. A merge made with GITHUB_TOKEN
  # does not trigger the push run on main, so each update is tested on its own PR branch only.
  dependabot-merge:
    name: Merge Dependabot update
    needs: [test, audit]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Read update metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Squash merge
        run: |
          echo "Merging $DEPENDENCIES ($UPDATE_TYPE)"
          # Only the commit these checks ran on: if Dependabot pushed again meanwhile, the merge is refused and the
          # new run merges instead.
          gh pr merge --squash --delete-branch --match-head-commit "$HEAD_SHA" "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPENDENCIES: ${{ steps.meta.outputs.dependency-names }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
