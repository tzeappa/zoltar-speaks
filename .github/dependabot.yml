version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Updates merge without review, so wait a week after a release: a hijacked package version is usually found and
    # pulled within days. Security updates are not delayed.
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    groups:
      # One PR for all minor and patch bumps; each major gets its own PR, so a breaking change fails CI on its own
      # and does not block the safe updates. Both merge automatically once CI passes.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
